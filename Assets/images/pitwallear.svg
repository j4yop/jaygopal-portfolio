  </defs>
  <rect width="1600" height="900" fill="#FBFF48"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <g font-family="'Space Grotesk','Arial Black',sans-serif" font-weight="900" fill="#000">
    <rect x="80" y="80" width="240" height="60" fill="#fff" stroke="#000" stroke-width="4"/>
