<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <pattern id="grid3" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#fff" stroke-width="1" opacity="0.15"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="#A855F7"/>
  <rect width="1600" height="900" fill="url(#grid3)"/>

  <!-- Tag -->
  <g transform="translate(80,80)">
    <rect width="280" height="64" fill="#000" stroke="#fff" stroke-width="4"/>
    <text x="20" y="44" font-family="'JetBrains Mono',monospace" font-size="28" font-weight="700" fill="#FBFF48">D8FN [RESEARCH]</text>
  </g>

  <!-- Headline -->
  <g font-family="'Space Grotesk','Arial Black',sans-serif" font-weight="900">
    <text x="80" y="280" font-size="120" letter-spacing="-4" fill="#fff">SAR FLOOD</text>
    <text x="80" y="410" font-size="120" letter-spacing="-4" fill="#FBFF48">MAPPING.</text>
    <text x="80" y="540" font-size="120" letter-spacing="-4" fill="#fff">PHYSICS-INFORMED.</text>
  </g>

  <!-- Sub -->
  <g transform="translate(80,580)">
    <rect width="980" height="56" fill="#fff" stroke="#000" stroke-width="4"/>
    <text x="20" y="38" font-family="'JetBrains Mono',monospace" font-size="20" font-weight="700" fill="#000">
      UNet + D8 flow routing + DEM + HAND · differentiable hydrology constraints
    </text>
  </g>

  <!-- Tags -->
  <g transform="translate(80,680)" font-family="'JetBrains Mono',monospace" font-size="20" font-weight="700">
    <g><rect width="120" height="44" fill="#000"/><text x="20" y="30" fill="#fff">PyTorch</text></g>
    <g transform="translate(130,0)"><rect width="120" height="44" fill="#000"/><text x="20" y="30" fill="#FBFF48">UNet</text></g>
    <g transform="translate(260,0)"><rect width="180" height="44" fill="#000"/><text x="20" y="30" fill="#33FF57">D8 Flow Routing</text></g>
    <g transform="translate(450,0)"><rect width="180" height="44" fill="#000"/><text x="20" y="30" fill="#FF70A6">SAR imagery</text></g>
    <g transform="translate(640,0)"><rect width="160" height="44" fill="#000"/><text x="20" y="30" fill="#fff">DEM + HAND</text></g>
  </g>

  <!-- Right: SAR segmentation viz -->
  <g transform="translate(1100,160)">
    <!-- frame -->
    <rect width="440" height="500" fill="#000" stroke="#fff" stroke-width="6"/>
    <text x="20" y="36" font-family="'JetBrains Mono',monospace" font-size="14" font-weight="700" fill="#FBFF48">/// FLOOD SEGMENTATION + D8 FLOW</text>

    <!-- terrain background -->
    <rect x="20" y="60" width="400" height="380" fill="#1a1a1a"/>

    <!-- segmented flood zones -->
    <g opacity="0.85">
      <path d="M 60 280 Q 100 200 180 240 T 320 260 L 360 320 L 80 340 Z" fill="#33FF57" opacity="0.6"/>
      <path d="M 100 320 Q 160 280 220 300 T 360 320 L 380 380 L 120 400 Z" fill="#33FF57" opacity="0.4"/>
      <circle cx="220" cy="220" r="35" fill="#33FF57" opacity="0.5"/>
    </g>

    <!-- D8 flow lines (8-direction) -->
    <g stroke="#FBFF48" stroke-width="2" fill="none" opacity="0.9">
      <path d="M 60 100 L 220 240"/>
      <path d="M 140 80 L 240 220"/>
      <path d="M 220 100 L 240 220"/>
      <path d="M 300 80 L 240 220"/>
      <path d="M 380 100 L 240 220"/>
      <path d="M 60 380 L 220 280"/>
      <path d="M 140 400 L 220 280"/>
      <path d="M 220 400 L 220 280"/>
      <path d="M 300 400 L 220 280"/>
      <path d="M 380 380 L 220 280"/>
    </g>

    <!-- nodes -->
    <g fill="#FBFF48">
      <circle cx="60" cy="100" r="4"/>
      <circle cx="140" cy="80" r="4"/>
      <circle cx="220" cy="100" r="4"/>
      <circle cx="300" cy="80" r="4"/>
      <circle cx="380" cy="100" r="4"/>
      <circle cx="60" cy="380" r="4"/>
      <circle cx="140" cy="400" r="4"/>
      <circle cx="220" cy="400" r="4"/>
      <circle cx="300" cy="400" r="4"/>
      <circle cx="380" cy="380" r="4"/>
      <circle cx="220" cy="220" r="6" fill="#FF2A2A"/>
    </g>

    <!-- metrics -->
    <g transform="translate(20,460)">
      <rect width="400" height="36" fill="#33FF57"/>
      <text x="12" y="24" font-family="'JetBrains Mono',monospace" font-size="14" font-weight="700" fill="#000">IoU: 0.84  ·  F1: 0.91  ·  PA-IoU: 0.78</text>
    </g>
  </g>

  <!-- "ONGOING" badge -->
  <g transform="translate(1340,80)">
    <rect width="180" height="64" fill="#FF2A2A" stroke="#000" stroke-width="4" transform="rotate(3)"/>
    <text x="90" y="42" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="24" font-weight="800" fill="#fff" transform="rotate(3)">ONGOING</text>
  </g>
</svg>