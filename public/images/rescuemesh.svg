<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <pattern id="grid2" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#33FF57" stroke-width="1" opacity="0.15"/>
    </pattern>
    <radialGradient id="bg2" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#000"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg2)"/>
  <rect width="1600" height="900" fill="url(#grid2)"/>

  <!-- Tag -->
  <g transform="translate(80,80)">
    <rect width="340" height="64" fill="#33FF57" stroke="#000" stroke-width="4"/>
    <text x="20" y="44" font-family="'JetBrains Mono',monospace" font-size="28" font-weight="700" fill="#000">RESCUEMESH.exe</text>
  </g>

  <!-- Headline -->
  <g font-family="'Space Grotesk','Arial Black',sans-serif" font-weight="900">
    <text x="80" y="280" font-size="120" letter-spacing="-4" fill="#fff">OFFLINE.</text>
    <text x="80" y="410" font-size="120" letter-spacing="-4" fill="#FBFF48">DISASTER.</text>
    <text x="80" y="540" font-size="120" letter-spacing="-4" fill="#fff">RESPONSE.</text>
  </g>

  <!-- Sub -->
  <g transform="translate(80,580)">
    <rect width="900" height="56" fill="#000" stroke="#33FF57" stroke-width="4"/>
    <text x="20" y="38" font-family="'JetBrains Mono',monospace" font-size="22" font-weight="700" fill="#33FF57">
      Gemma 4 on-device · P2P mesh · 56 emergency RAG packs
    </text>
  </g>

  <!-- Tags -->
  <g transform="translate(80,680)" font-family="'JetBrains Mono',monospace" font-size="20" font-weight="700">
    <g><rect width="140" height="44" fill="#33FF57"/><text x="20" y="30" fill="#000">Flutter</text></g>
    <g transform="translate(150,0)"><rect width="200" height="44" fill="#FF70A6"/><text x="20" y="30" fill="#000">Gemma 4 E2B/E4B</text></g>
    <g transform="translate(360,0)"><rect width="200" height="44" fill="#A855F7"/><text x="20" y="30" fill="#fff">ObjectBox RAG</text></g>
    <g transform="translate(570,0)"><rect width="220" height="44" fill="#FBFF48"/><text x="20" y="30" fill="#000">WiFi Direct mesh</text></g>
  </g>

  <!-- Right: phone mockup with mesh viz -->
  <g transform="translate(1140,140)">
    <!-- phone frame -->
    <rect x="0" y="0" width="300" height="620" rx="36" fill="#000" stroke="#33FF57" stroke-width="6"/>
    <rect x="20" y="60" width="260" height="540" rx="6" fill="#0a0a0a"/>
    <!-- status -->
    <text x="150" y="40" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="14" font-weight="700" fill="#33FF57">● MESH ACTIVE</text>
    <!-- mesh nodes -->
    <g stroke="#33FF57" stroke-width="2" fill="#33FF57">
      <line x1="150" y1="240" x2="80" y2="160" />
      <line x1="150" y1="240" x2="220" y2="160" />
      <line x1="150" y1="240" x2="80" y2="320" />
      <line x1="150" y1="240" x2="220" y2="320" />
      <line x1="150" y1="240" x2="150" y2="100" />
      <line x1="150" y1="240" x2="150" y2="400" />
      <circle cx="150" cy="240" r="12" />
      <circle cx="80" cy="160" r="8" />
      <circle cx="220" cy="160" r="8" />
      <circle cx="80" cy="320" r="8" />
      <circle cx="220" cy="320" r="8" />
      <circle cx="150" cy="100" r="8" />
      <circle cx="150" cy="400" r="8" />
    </g>
    <!-- bottom panel -->
    <rect x="20" y="460" width="260" height="120" fill="#1a1a1a" stroke="#33FF57" stroke-width="2"/>
    <text x="36" y="490" font-family="'JetBrains Mono',monospace" font-size="14" font-weight="700" fill="#33FF57">// QUERY</text>
    <text x="36" y="514" font-family="sans-serif" font-size="14" fill="#fff">CPR for child, 6yo</text>
    <text x="36" y="540" font-family="'JetBrains Mono',monospace" font-size="14" font-weight="700" fill="#FBFF48">// RESPONSE</text>
    <text x="36" y="562" font-family="sans-serif" font-size="13" fill="#fff">30:2 ratio · 5 cycles</text>
  </g>

  <!-- Floating nodes around phone -->
  <g fill="#FF70A6" stroke="#fff" stroke-width="2">
    <circle cx="1080" cy="180" r="8"/>
    <circle cx="1480" cy="220" r="8"/>
    <circle cx="1100" cy="700" r="8"/>
    <circle cx="1500" cy="680" r="8"/>
  </g>
  <g stroke="#FF70A6" stroke-width="2" fill="none" opacity="0.6">
    <path d="M 1080 180 Q 1180 260 1280 240"/>
    <path d="M 1480 220 Q 1400 360 1320 380"/>
    <path d="M 1100 700 Q 1200 620 1300 620"/>
    <path d="M 1500 680 Q 1420 560 1340 540"/>
  </g>
</svg>