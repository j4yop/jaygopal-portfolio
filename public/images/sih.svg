<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <pattern id="g4" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#fff" stroke-width="1" opacity="0.1"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="#121212"/>
  <rect width="1600" height="900" fill="url(#g4)"/>

  <!-- Tag -->
  <g transform="translate(80,80)">
    <rect width="220" height="56" fill="#FF2A2A" stroke="#fff" stroke-width="3"/>
    <text x="18" y="40" font-family="'JetBrains Mono',monospace" font-size="22" font-weight="700" fill="#fff">SIH 2025</text>
  </g>
  <g transform="translate(320,80)">
    <rect width="280" height="56" fill="#000" stroke="#33FF57" stroke-width="3"/>
    <text x="18" y="40" font-family="'JetBrains Mono',monospace" font-size="22" font-weight="700" fill="#33FF57">/// LEAD ARCHITECT</text>
  </g>

  <!-- Title -->
  <g font-family="'Space Grotesk','Arial Black',sans-serif" font-weight="900">
    <text x="80" y="280" font-size="110" letter-spacing="-4" fill="#fff">SMART COMMUNITY</text>
    <text x="80" y="400" font-size="110" letter-spacing="-4" fill="#FBFF48">HEALTH</text>
    <text x="80" y="520" font-size="110" letter-spacing="-4" fill="#fff">MONITORING.</text>
  </g>

  <!-- Sub -->
  <g transform="translate(80,560)">
    <rect width="900" height="50" fill="#33FF57"/>
    <text x="16" y="34" font-family="'JetBrains Mono',monospace" font-size="20" font-weight="700" fill="#000">
      Water-borne disease early-detection · 36-hour sprint · Team of 6
    </text>
  </g>

  <!-- Tags -->
  <g transform="translate(80,640)" font-family="'JetBrains Mono',monospace" font-size="18" font-weight="700">
    <g><rect width="140" height="40" fill="#fff"/><text x="20" y="28" fill="#000">Node.js</text></g>
    <g transform="translate(150,0)"><rect width="160" height="40" fill="#fff"/><text x="20" y="28" fill="#000">Firebase</text></g>
    <g transform="translate(320,0)"><rect width="200" height="40" fill="#FBFF48"/><text x="20" y="28" fill="#000">Sensor stack</text></g>
    <g transform="translate(530,0)"><rect width="200" height="40" fill="#FF70A6"/><text x="20" y="28" fill="#000">Healthcare AI</text></g>
  </g>

  <!-- Right: dashboard mock -->
  <g transform="translate(1080,180)">
    <rect width="460" height="500" fill="#000" stroke="#fff" stroke-width="4"/>
    <rect x="0" y="0" width="460" height="40" fill="#fff"/>
    <circle cx="20" cy="20" r="6" fill="#FF2A2A"/>
    <circle cx="40" cy="20" r="6" fill="#FBFF48"/>
    <circle cx="60" cy="20" r="6" fill="#33FF57"/>
    <text x="240" y="26" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="14" font-weight="700" fill="#000">/health-dashboard</text>

    <!-- stats grid -->
    <g transform="translate(20,60)">
      <g>
        <rect width="200" height="100" fill="#33FF57"/>
        <text x="16" y="32" font-family="'JetBrains Mono',monospace" font-size="12" font-weight="700" fill="#000">// ACTIVE NODES</text>
        <text x="16" y="78" font-family="'Space Grotesk',sans-serif" font-size="36" font-weight="900" fill="#000">128</text>
      </g>
      <g transform="translate(220,0)">
        <rect width="200" height="100" fill="#FBFF48"/>
        <text x="16" y="32" font-family="'JetBrains Mono',monospace" font-size="12" font-weight="700" fill="#000">// ALERTS</text>
        <text x="16" y="78" font-family="'Space Grotesk',sans-serif" font-size="36" font-weight="900" fill="#000">3</text>
      </g>
    </g>

    <!-- chart -->
    <g transform="translate(20,180)">
      <rect width="420" height="160" fill="#1a1a1a"/>
      <g stroke="#33FF57" stroke-width="3" fill="none">
        <path d="M 20 120 L 60 100 L 100 110 L 140 80 L 180 90 L 220 60 L 260 70 L 300 50 L 340 60 L 380 40 L 400 50"/>
      </g>
      <g fill="#33FF57">
        <circle cx="20" cy="120" r="4"/>
        <circle cx="60" cy="100" r="4"/>
        <circle cx="100" cy="110" r="4"/>
        <circle cx="140" cy="80" r="4"/>
        <circle cx="180" cy="90" r="4"/>
        <circle cx="220" cy="60" r="4"/>
        <circle cx="260" cy="70" r="4"/>
        <circle cx="300" cy="50" r="4"/>
        <circle cx="340" cy="60" r="4"/>
        <circle cx="380" cy="40" r="4"/>
      </g>
      <text x="20" y="24" font-family="'JetBrains Mono',monospace" font-size="12" font-weight="700" fill="#33FF57">/// WATER-BORNE INCIDENCE / 7d</text>
    </g>

    <!-- alerts -->
    <g transform="translate(20,360)">
      <rect width="420" height="120" fill="#FF2A2A"/>
      <text x="16" y="32" font-family="'JetBrains Mono',monospace" font-size="12" font-weight="700" fill="#fff">/// EARLY WARNING</text>
      <text x="16" y="64" font-family="sans-serif" font-size="16" font-weight="700" fill="#fff">SECTOR 7 — Diarrhea cluster detected</text>
      <text x="16" y="88" font-family="sans-serif" font-size="14" fill="#fff">Confidence 0.91 · Dispatch ASHA worker</text>
      <text x="16" y="108" font-family="'JetBrains Mono',monospace" font-size="11" fill="#fff">// 14 mins ago</text>
    </g>
  </g>
</svg>