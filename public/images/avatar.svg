<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <pattern id="dot" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1.5" fill="#000" opacity="0.4"/>
    </pattern>
  </defs>
  <rect width="800" height="800" fill="#FBFF48"/>
  <rect width="800" height="800" fill="url(#dot)"/>

  <!-- outer frame -->
  <rect x="40" y="40" width="720" height="720" fill="none" stroke="#121212" stroke-width="6"/>

  <!-- "JT" monogram -->
  <g font-family="'Space Grotesk','Arial Black',sans-serif" font-weight="900">
    <text x="400" y="500" text-anchor="middle" font-size="420" fill="#121212" letter-spacing="-20">JT</text>
  </g>

  <!-- corner tags -->
  <g font-family="'JetBrains Mono',monospace" font-weight="700">
    <rect x="60" y="60" width="160" height="36" fill="#121212"/>
    <text x="74" y="86" font-size="16" fill="#33FF57">/// JAY.EXE</text>

    <rect x="580" y="704" width="160" height="36" fill="#FF2A2A"/>
    <text x="594" y="730" font-size="16" fill="#fff">v2026.08</text>
  </g>

  <!-- circuit lines -->
  <g stroke="#121212" stroke-width="3" fill="none" opacity="0.5">
    <path d="M 60 200 L 200 200 L 200 320"/>
    <path d="M 740 200 L 600 200 L 600 320"/>
    <path d="M 60 600 L 200 600 L 200 480"/>
    <path d="M 740 600 L 600 600 L 600 480"/>
  </g>
  <g fill="#121212">
    <circle cx="200" cy="320" r="6"/>
    <circle cx="600" cy="320" r="6"/>
    <circle cx="200" cy="480" r="6"/>
    <circle cx="600" cy="480" r="6"/>
  </g>
</svg>